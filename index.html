	// Monitor for messages view and toggle a mobile-only class; initialize after DOM is ready
	(function(){
		function initMessagesMonitor(){
			try{
					var innerLeft = document.getElementById('inner_left_panel');
					function updateMessagesOpen(){
						var rightPanelMessages = document.querySelector('#inner_right_panel #messages_holder_parent, #inner_right_panel #messages_holder');
						var leftPanelThreadOpen = !!document.querySelector('#inner_left_panel.mobile-chat-thread #messages_holder_parent, #inner_left_panel.mobile-chat-thread #messages_holder');
						var chatOpen = !!rightPanelMessages || leftPanelThreadOpen;
					// check the message input - if it's visible or focused we should hide the left panel on mobile
					var msgInput = document.getElementById('message_text');
					var inputVisible = false;
					var inputFocused = false;
					try{
						inputFocused = (document.activeElement === msgInput);
						if(msgInput){
								// consider visible on screen when its bounding rect intersects the viewport
								try{
									var r = msgInput.getBoundingClientRect();
									inputVisible = (r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < (window.innerHeight || document.documentElement.clientHeight));
								}catch(err){
									inputVisible = (msgInput.offsetParent !== null) && (msgInput.offsetWidth > 0 && msgInput.offsetHeight > 0);
								}
							}
					}catch(err){ /* defensive */ }
					var hideLeftBecauseInput = inputVisible || inputFocused;
					// mobile breakpoint aligned with CSS (<=500px)
					// We only add 'messages-open' when an actual chat is open (chatOpen === true).
					// Previously typing/focus could also trigger it and hide the chat list — that
					// made the chats disappear. Keep typing-related behavior separate (left-hidden)
					// so the chat list remains visible when no chat is open.
					var isMobile = (window.innerWidth <= 500);
						if(isMobile && chatOpen){
							// a chat is open on small screens: mark messages-open so CSS hides inner left panel
							document.body.classList.add('messages-open');
							document.body.classList.remove('messages-closed');
							document.body.classList.remove('left-hidden');
							try{ if(innerLeft) innerLeft.style.display = ''; }catch(err){}
						} else {
						// no chat open: ensure the chat list remains visible
						document.body.classList.remove('messages-open');
						document.body.classList.add('messages-closed');
						try{ if(innerLeft) innerLeft.style.display = ''; }catch(err){}
						// if the user is typing but no chat is open, prefer using the left-hidden class
						// instead of messages-open. Do not toggle messages-open here.
						if(!leftPanelThreadOpen && hideLeftBecauseInput && isMobile){
							document.body.classList.add('left-hidden');
						} else {
							document.body.classList.remove('left-hidden');
						}
					}
				}
				// initial run
				updateMessagesOpen();
				// observe DOM changes (messages may be injected dynamically)
				var mo = new MutationObserver(updateMessagesOpen);
				mo.observe(document.body, { childList: true, subtree: true });
				// listen for radio changes and clicks on the chat label
				var radioChatInput = document.getElementById('radio_chat');
				if(radioChatInput) radioChatInput.addEventListener('change', updateMessagesOpen);
				var chatLabel = document.getElementById('label_chat');
				if(chatLabel) chatLabel.addEventListener('click', function(){ setTimeout(updateMessagesOpen,50); });

				// watch for focus on the message input so we can hide the left panel while typing
				document.addEventListener('focusin', function(ev){ if(ev.target && ev.target.id === 'message_text') updateMessagesOpen(); });
				document.addEventListener('focusout', function(ev){ if(ev.target && ev.target.id === 'message_text') setTimeout(updateMessagesOpen,50); });

				// also update visibility on scroll (viewport changes) to detect when the input enters/leaves view
				window.addEventListener('scroll', updateMessagesOpen, true);
				// update on resize
				window.addEventListener('resize', updateMessagesOpen);
			}catch(e){ console.warn('messages-open monitor failed', e); }
		}
		if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMessagesMonitor); else initMessagesMonitor();
	})();

(() => {
	// use same-origin path for signaling so we can proxy wss through nginx (works with http or https)
	const SIGNALING_URL = window.CAROCHAT_WS_URL || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':3000');
  const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

  let ws;
  let localStream = null;
  let pc = null;
  let currentTarget = null;
	let audioUnlocked = false; // set to true after user gesture unlocks audio playback

	// Try to unlock audio playback via a user gesture by resuming AudioContext and playing a tiny silent buffer.
	async function unlockAudio(){
		if(audioUnlocked) return true;
		try{
			const Ctx = window.AudioContext || window.webkitAudioContext;
			if(!Ctx) return false;
			const ctx = new Ctx();
			if(ctx.state === 'suspended') await ctx.resume();
			// play a silent buffer to unlock autoplay restrictions
			const buffer = ctx.createBuffer(1, 1, 22050);
			const src = ctx.createBufferSource();
			src.buffer = buffer;
			src.connect(ctx.destination);
			src.start(0);
			audioUnlocked = true;
					// persist unlocked state so future visits on same browser won't require re-click
					try{ localStorage.setItem('carochat_audio_unlocked','1'); }catch(e){}
					const btn = document.getElementById('enable_audio_btn'); if(btn) btn.style.display = 'none';
			console.log('audio unlocked');
			return true;
		}catch(e){ console.warn('unlockAudio failed', e); return false; }
	}

	function ensureEnableAudioButton(){
		if(document.getElementById('enable_audio_btn')) return;

		btn.style.position = 'fixed';
		btn.style.right = '20px';
		btn.style.bottom = '60px';
		btn.style.zIndex = 10002;
		btn.style.padding = '6px 8px';

	function connectSignaling() {

		if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return ws;
		ws = new WebSocket(SIGNALING_URL);
		// expose ws for debugging
		try{ window._signaling_ws_ref = ws; }catch(e){}
		ws.addEventListener('open', () => {
			const id = getCurrentUserId();
			log('ws open, registering user', id);
			try{ if(window.signalingClient) window.signalingClient._socketOpen = true; }catch(e){}
			if (id) {

			}

		ws.addEventListener('message', ev => {
			// log raw message for easier debugging
			try{ console.log('[signaling][recv]', ev.data); }catch(e){}
			let msg;
			try{ msg = JSON.parse(ev.data); }catch(err){ console.warn('invalid signaling JSON', ev.data); return; }
			handleSignalMessage(msg);

		ws.addEventListener('error', e => console.error('ws error', e));
		return ws;
	}

	// Safe sender: only send when the socket is OPEN. Returns true on send, false otherwise.
	function safeSignalSend(obj){
		try{
			if (!ws || ws.readyState !== WebSocket.OPEN) {
				console.warn('[signaling] send skipped, socket not open', obj);
				return false;
			}
			// normalize ids to strings to avoid numeric/string mismatches

			try{ if(obj && obj.to) obj.to = String(obj.to); }catch(e){}

		}catch(e){ console.warn('[signaling] safeSignalSend failed', e); return false; }

	const peerConnections = new Map();

		pc.oniceconnectionstatechange = () => { try{ console.log('[signaling][pc] iceConnectionState', pc.iceConnectionState); }catch(e){} };
		pc.onicegatheringstatechange = () => { try{ console.log('[signaling][pc] iceGatheringState', pc.iceGatheringState); }catch(e){} };
		pc.onsignalingstatechange = () => { try{ console.log('[signaling][pc] signalingState', pc.signalingState); }catch(e){} };

	async function ensureLocalAudio(){

		return localStream;

  function createPeerConnection(toId) {

			pc.onicegatheringstatechange = () => { try{ console.log('[signaling][pc] iceGatheringState', pc.iceGatheringState); }catch(e){} };
			pc.onsignalingstatechange = () => { try{ console.log('[signaling][pc] signalingState', pc.signalingState); }catch(e){} };

	async function startLiveTalk(toId) {

		if (String(toId) === String(getCurrentUserId())) { console.warn('refusing to call self'); return; }

		const audioTrack = stream.getAudioTracks()[0];
		const alreadySending = pc.getSenders ? pc.getSenders().some(s => s.track && s.track.kind === 'audio') : false;

		if (!alreadySending) {
			try{ pc.addTrack(audioTrack, stream); }catch(e){ console.warn('addTrack failed', e); }

			// negotiation lock
			try{ if(window.signalingClient) window.signalingClient._negotiating = true; }catch(e){}
			let _negTO = null;
			try{ _negTO = setTimeout(()=>{ try{ if(window.signalingClient) window.signalingClient._negotiating = false; }catch(e){} }, 8000); }catch(e){}

			try {
				const offer = await pc.createOffer();
				await pc.setLocalDescription(offer);
				safeSignalSend({ type: 'offer', from: String(getCurrentUserId()), to: currentTarget, payload: offer });
				log('sent offer to', currentTarget);
			} catch (err) {
				console.error('startLiveTalk error', err);
			} finally {
				try{ if(window.signalingClient) window.signalingClient._negotiating = false; }catch(e){}
				try{ if(_negTO) clearTimeout(_negTO); }catch(e){}
			}
		}

		// unmute local tracks to transmit audio while holding mic
		try{ stream.getAudioTracks().forEach(t => t.enabled = true); }catch(e){}
	}

	async function stopLiveTalk() {
		// mute local tracks but keep PC and websocket alive for quick resume
		if (localStream) {
			try{ localStream.getAudioTracks().forEach(t => t.enabled = false); }catch(e){}
		}
		currentTarget = null;
		log('stopped live talk (muted, pc retained)');
	}

	// stop transmitting audio but keep PC alive so incoming audio continues

		}catch(e){ console.error('stopTransmit error', e); }
	}

	async function handleSignalMessage(msg) {
		const { type, from, payload } = msg;
		const fromId = String(from || "");
		log('signal:', type, 'from', fromId);

		if (type === 'offer') {
			currentTarget = fromId;
			const peer = getOrCreatePeerConnection(fromId);
			await peer.setRemoteDescription(new RTCSessionDescription(payload));
			const answer = await peer.createAnswer();
			await peer.setLocalDescription(answer);
			sendSignal({ type: 'answer', from: String(getCurrentUserId()), to: fromId, payload: answer });
			log('sent answer to', fromId);
			return;
		}

		if (type === 'answer') {
			try {
				const peer = getOrCreatePeerConnection(fromId);
				if (!peer.localDescription) {
					console.warn('answer received before localDescription was ready');
					return;
				}
				await peer.setRemoteDescription(new RTCSessionDescription(payload));
				log('remote answer applied for', fromId);
			} catch (err) {
				console.error('failed to apply remote answer', err);
			} finally {
				try { if (window.signalingClient) window.signalingClient._negotiating = false; } catch (e) {}
			}
			return;
		}

		if (type === 'candidate') {
			try {
				const peer = getOrCreatePeerConnection(fromId);
				await peer.addIceCandidate(new RTCIceCandidate(payload));
			} catch (err) {
				console.warn('addIceCandidate error', err);
			}
			return;
		}

		if (type === 'registered') {
			const id = msg.id || payload || getCurrentUserId();
			log('registered as', id);
			try {
				if (window.signalingClient) {
					window.signalingClient._connected = true;
					window.signalingClient._socketOpen = true;
					window.signalingClient.peers = msg.peers || [];
				}
			} catch (e) {}
			if (typeof updateDebugSignalingBadge === 'function') updateDebugSignalingBadge();
			return;
		}

		if (type === 'peers') {
			try { if (window.signalingClient) window.signalingClient.peers = msg.peers || []; } catch (e) {}
			if (typeof updateDebugSignalingBadge === 'function') updateDebugSignalingBadge();
			return;
		}

		if (type === 'error') {
			console.warn('signaling error', msg.message);
		}
	}

	function get_data(find,type){

		var xml = new XMLHttpRequest();
		var requestMeta = {
			type: type || "",
			isLeftPanelRequest: false,
			requestId: 0
		};

		try{
			if(is_left_panel_data_type(type)){
				window.__leftPanelRequestCounter = (window.__leftPanelRequestCounter || 0) + 1;
				window.__latestLeftPanelRequestId = window.__leftPanelRequestCounter;
				requestMeta.isLeftPanelRequest = true;
				requestMeta.requestId = window.__leftPanelRequestCounter;
			}
		}catch(e){}
		// ensure cookies (session) are sent for same-origin requests
		xml.withCredentials = true;
		var loader_holder = _("loader_holder");
		loader_holder.className = "loader_on";
		xml.onload = function (){

			// Only handle result when request is complete and status is OK
			if(xml.readyState == 4 && xml.status == 200){

				loader_holder.className = "loader_off";
				handle_result(xml.responseText,type,requestMeta);
			}

		}

		var data = {};
		data.find = find;
		data.data_type = type;
		data = JSON.stringify(data);

		xml.open("POST","api.php",true);
		xml.send(data);
	}

		reset_mobile_chat_panel();
		inner_left_panel.classList.add("mobile-chat-thread");
		document.body.classList.add("left-chat-open");
		document.body.classList.add("messages-open");
		document.body.classList.remove("messages-closed");
		document.body.classList.remove("left-hidden");
		inner_left_panel.innerHTML = build_mobile_chat_header_markup(userHtml) + (messagesHtml || "");
		if(inner_right_panel){
			inner_right_panel.innerHTML = "";
		}

			var backBtn = document.getElementById("mobile_chat_back_btn");
			if(backBtn){
				backBtn.onclick = function(e){
					if(e && e.preventDefault) e.preventDefault();
					return_from_mobile_chat_thread();
				};
			}

			try{ if(typeof init_voice_note_meta === "function") init_voice_note_meta(inner_left_panel); }catch(err){}
			try{ window.__lastLeftUpdate = Date.now(); }catch(e){}
		}

	function handle_result(result,type,requestMeta){

			if(result.trim() != ""){

				var inner_right_panel = _("inner_right_panel");
				if(inner_right_panel) try{ inner_right_panel.style.overflow = "visible"; }catch(e){}

				// parse JSON safely; if response is HTML (PHP warning/login page) handle gracefully
				// quick guard: if the server returned HTML (starts with '<') don't attempt JSON.parse
				if(result.trim().charAt(0) === '<'){
					console.error('API returned HTML instead of JSON — aborting handle_result.');
					// likely a session redirect or PHP error page; redirect to login to recover
					try{ if(result.indexOf('login.php') !== -1) window.location = 'login.php'; }catch(err){}
					return;
				}

				var obj;
					try{
						obj = JSON.parse(result);
					}catch(e){
						console.error('Invalid JSON from API:', e, result);
						return;
					}

					try{
							if(is_left_panel_data_type(obj.data_type)){
								var latestLeftPanelRequestId = Number(window.__latestLeftPanelRequestId || 0);
								var activeLeftPanelType = get_active_left_panel_type();

								if(requestMeta && requestMeta.isLeftPanelRequest && requestMeta.requestId && latestLeftPanelRequestId && requestMeta.requestId < latestLeftPanelRequestId){
									log_left_panel_debug('Ignoring stale left-panel response for', obj.data_type, 'request', requestMeta.requestId, 'latest is', latestLeftPanelRequestId);
									return;
								}

								if(activeLeftPanelType && activeLeftPanelType != obj.data_type){
									log_left_panel_debug('Ignoring left-panel response for inactive view', obj.data_type, 'active view is', activeLeftPanelType);
									return;
								}
							}
					}catch(e){ console.warn('left-panel response guard failed', e); }
					if(typeof(obj.logged_in) != "undefined" && !obj.logged_in){
	 
						window.location = "login.php";
				}else{

						// Helper: ensure any relative <img> srcs inside server-rendered message HTML
						// are converted to absolute URLs so the browser requests the correct path.
						function _fixMessageImageURLs(container){
							try{
								if(!container) return;
								var el = (typeof container === 'string') ? document.querySelector(container) : container;
								if(!el) return;
								var imgs = el.querySelectorAll('img');
								var origin = window.location.origin.replace(/\/$/,'');
								for(var i=0;i<imgs.length;i++){
									var img = imgs[i];
									var src = img.getAttribute('src') || '';
									if(!src) continue;
									// skip already-absolute, protocol-relative, and data URLs
									if(/^https?:\/\//i.test(src) || /^\/\//.test(src) || /^data:/i.test(src)) continue;
									// make absolute
									if(src.charAt(0) === '/'){
										img.src = origin + src;
									} else {
										img.src = origin + '/' + src;
									}
								}
							}catch(e){ console.warn('_fixMessageImageURLs failed', e); }
						}


					switch(obj.data_type){

						case "user_info":
							var username = _("username");
							var email = _("email");
							var profile_image = _("profile_image");

							if(username) username.innerHTML = obj.username;
							if(email) email.innerHTML = obj.email;
							try{
								var imgSrc = obj.image || '';
								if(imgSrc){
									if(profile_image) {
										if(imgSrc.indexOf('?') === -1) profile_image.src = imgSrc + '?_=' + Date.now();
										else profile_image.src = imgSrc + '&_=' + Date.now();
									}
								} else {
									if(profile_image) profile_image.src = imgSrc;
								}
							}catch(e){ try{ if(profile_image) profile_image.src = obj.image; }catch(err){} }
							// expose current user id for signaling (best-effort from server response)
							window.CURRENT_USER_ID = String(obj.userid || obj.user_id || obj.id || obj.username);
							console.log('user_info received — setting CURRENT_USER_ID =', window.CURRENT_USER_ID, obj);
							// if signaling client exists, connect/register now
							try{ if(window.signalingClient && typeof window.signalingClient.connect === 'function') window.signalingClient.connect(); }catch(e){}
							break;

							// detect whether a chunk of HTML contains a chat list (used to avoid overwrites)
							function htmlContainsChats(html){
								try{
									if(!html) return false;
									var tmp = document.createElement('div'); tmp.innerHTML = html;
									// check for common markers: container with class 'chats_list' or items with class 'chat_item'
									if(tmp.querySelector && (tmp.querySelector('.chats_list') || tmp.querySelector('.chat_item') || tmp.querySelector('.desktop_chat_sidebar_shell') || tmp.querySelector('.desktop_chat_sidebar_item'))) return true;
									// also check for visible headings that indicate presence of chats
									var text = (tmp.textContent||'').toLowerCase();
									if(text.indexOf('previous chats') !== -1 || text.indexOf('previous:') !== -1) return true;
									return false;
								}catch(e){ return false; }
							}

													function shouldApplyLeftUpdate(html){
														// if user very recently opened the chats panel, avoid clobbering unless the server payload contains real chat items
														// respect the configurable hold period (window.__LEFT_PANEL_HOLD_MS) if present
														try{
															var hold = (typeof window.__LEFT_PANEL_HOLD_MS === 'number') ? window.__LEFT_PANEL_HOLD_MS : 2500;
															if(typeof window.__lastLeftUpdate === 'number' && (Date.now() - window.__lastLeftUpdate) < hold){
																return htmlContainsChats(html);
															}
														}catch(e){ /* defensive */ }
														return true;
													}


							case "contacts":
							var inner_left_panel = _("inner_left_panel");
							var forceContactsLeftUpdate = consume_forced_left_update("contacts");

									if(is_mobile_chat_layout()){
										reset_mobile_chat_panel();
										if(inner_right_panel) inner_right_panel.innerHTML = "";
									}

									if(inner_right_panel) try{ inner_right_panel.style.overflow = "hidden"; }catch(e){}
								// avoid overwriting a recent manual left-panel render (e.g. user clicked Chat)
									try{
										if(forceContactsLeftUpdate || shouldApplyLeftUpdate(obj.message)){
											if(inner_left_panel) inner_left_panel.innerHTML = obj.message;
										} else {
											log_left_panel_debug('Skipping server left-panel update (contacts) because user recently opened chats and payload contains no chat items');
										}
									}catch(e){ if(inner_left_panel) inner_left_panel.innerHTML = obj.message; }
								break;

							case "chats_refresh":
							SEEN_STATUS = false;
							var messages_holder = _("messages_holder");
							if(inner_right_panel && is_desktop_app_layout()) try{ inner_right_panel.style.overflow = "hidden"; }catch(e){}
								if(messages_holder){
									var nextRawMessages = String(obj.messages || "");
									var previousRawMessages = String(messages_holder.getAttribute("data-raw-html") || "");
									if(previousRawMessages !== nextRawMessages){
										messages_holder.innerHTML = nextRawMessages;
										messages_holder.setAttribute("data-raw-html", nextRawMessages);
										// fix any relative image URLs produced by the server so the browser will fetch them
										_tryFix: try{ _fixMessageImageURLs(messages_holder); }catch(e){}
										try{ if(typeof init_voice_note_meta === "function") init_voice_note_meta(messages_holder); }catch(err){}
									}
									setTimeout(function(){
										if(messages_holder.scrollTo) messages_holder.scrollTo(0,messages_holder.scrollHeight);
										var message_text = _("message_text");
										if(message_text) message_text.focus();
								},100);

								// attach mic handlers (walkie-talkie)
								try{ if(typeof attachMicHandlers === 'function') attachMicHandlers(); }catch(err){}
								// attach live-talk handlers (WebRTC)
								try{ if(typeof attachLiveMicHandlers === 'function') attachLiveMicHandlers(); }catch(err){}
							}

							break;

							
							case "chats":
								SEEN_STATUS = false;
								var inner_left_panel = _("inner_left_panel");
								var hasChatMessages = !!(obj.messages && String(obj.messages).trim());
								var forceChatsLeftUpdate = consume_forced_left_update("chats");
								var desktopSidebarHtml = obj.sidebar || window.__desktopChatsSidebarHtml || "";

								if(is_mobile_chat_layout()){
									if(hasChatMessages){
										render_mobile_chat_thread(obj.user, obj.messages);
										try{ _fixMessageImageURLs(inner_left_panel); }catch(e){}
									}else{
										reset_mobile_chat_panel();
											try{
												if(forceChatsLeftUpdate || shouldApplyLeftUpdate(obj.user)){
													render_mobile_chat_list(obj.user);
												} else {
													log_left_panel_debug('Skipping server left-panel update (chats) because user recently opened chats and payload contains no chat items');
												}
											}catch(e){ render_mobile_chat_list(obj.user); }
										if(inner_right_panel) inner_right_panel.innerHTML = "";
									}
								}else{
									if(hasChatMessages){
										if(obj.sidebar){
											window.__desktopChatsSidebarHtml = obj.sidebar;
											desktopSidebarHtml = obj.sidebar;
										}
										try{
											if(desktopSidebarHtml && (forceChatsLeftUpdate || shouldApplyLeftUpdate(desktopSidebarHtml))){
												if(inner_left_panel) inner_left_panel.innerHTML = desktopSidebarHtml;
											} else if(!desktopSidebarHtml){
												log_left_panel_debug('Skipping desktop chat sidebar update because no sidebar HTML was returned');
											} else {
												log_left_panel_debug('Skipping server left-panel update (chats) because user recently opened chats and payload contains no chat items');
											}
										}catch(e){ if(inner_left_panel && desktopSidebarHtml) inner_left_panel.innerHTML = desktopSidebarHtml; }
									}else{
										CURRENT_CHAT_USER = "";
										if(obj.user){
											window.__desktopChatsSidebarHtml = obj.user;
											desktopSidebarHtml = obj.user;
										}
										try{
											if(forceChatsLeftUpdate || shouldApplyLeftUpdate(desktopSidebarHtml)){
												if(inner_left_panel) inner_left_panel.innerHTML = desktopSidebarHtml;
											} else {
												log_left_panel_debug('Skipping server left-panel update (chats) because user recently opened chats and payload contains no chat items');
											}
										}catch(e){ if(inner_left_panel) inner_left_panel.innerHTML = desktopSidebarHtml; }
									}
										if(inner_right_panel) {
											inner_right_panel.innerHTML = build_desktop_thread_markup(obj.user, obj.messages);
											// the server may output relative paths for uploaded files like "uploads/xxx.jpg";
											// normalize those to absolute URLs so images load reliably in the browser.
											try{ _fixMessageImageURLs(inner_right_panel); }catch(e){}
											try{ if(typeof init_voice_note_meta === "function") init_voice_note_meta(inner_right_panel); }catch(err){}
											try{ inner_right_panel.style.overflow = "hidden"; }catch(e){}
										}
										sync_desktop_chat_selection();
									}

								var messages_holder = _("messages_holder");
								if(messages_holder){
									try{ messages_holder.setAttribute("data-raw-html", String(obj.messages || "")); }catch(e){}
									setTimeout(function(){
										if(messages_holder.scrollTo) messages_holder.scrollTo(0,messages_holder.scrollHeight);
										var message_text = _("message_text");
										if(message_text) message_text.focus();
									},100);
								}

								// attach mic handlers (walkie-talkie)
								try{ if(typeof attachMicHandlers === 'function') attachMicHandlers(); }catch(err){}
								try{ if(typeof attachLiveMicHandlers === 'function') attachLiveMicHandlers(); }catch(err){}


									break;

							case "settings":
								var inner_left_panel = _("inner_left_panel");
								var forceSettingsLeftUpdate = consume_forced_left_update("settings");
								if(is_mobile_chat_layout()){
									reset_mobile_chat_panel();
									if(inner_right_panel) inner_right_panel.innerHTML = "";
								}
									try{
										if(forceSettingsLeftUpdate || shouldApplyLeftUpdate(obj.message)){
											if(inner_left_panel) inner_left_panel.innerHTML = obj.message;
										} else {
											log_left_panel_debug('Skipping server left-panel update (settings) because user recently opened chats and payload contains no chat items');
										}
									}catch(e){ if(inner_left_panel) inner_left_panel.innerHTML = obj.message; }
							break;

							case "send_image":
							alert(obj.message);
							break;

							case "save_settings":
	  
							alert(obj.message);
							get_data({},"user_info");
							if(get_active_left_panel_type() == "settings"){
								get_settings(true);
							}
							break;

						}

					
				}
			}	
	}

	function send_message(e)
	{

		var message_text = _("message_text");
		if(message_text.value.trim() == ""){


			alert("please start chat");
			return;

		}
		

		console.log('sending message to CURRENT_CHAT_USER =', CURRENT_CHAT_USER, 'from', window.CURRENT_USER_ID);
		get_data({

			message :message_text.value.trim(),
			userid :CURRENT_CHAT_USER

		},"send_message");

		// after sending, force a short-delay refresh for the sender so UI stays in sync
		setTimeout(function(){
			if(CURRENT_CHAT_USER){
				get_data({
					userid: String(CURRENT_CHAT_USER),
					seen: true
				}, "chats_refresh");
			}
		}, 300);

		// clear and refocus the input to improve UX
		try{
			message_text.value = "";
			message_text.focus();
		}catch(err){}

	}

	function enter_pressed(e)
	{
		// make the handler robust across browsers and insertion methods
		e = e || window.event || null;

		var code = 0;
		if(e){
			// modern: key, deprecated: keyCode/which
			if(typeof e.key !== 'undefined'){
				if(e.key === 'Enter') code = 13;
			}
			if(!code) code = e.keyCode || e.which || 0;
		}

		if(code === 13){
			// call send_message and prevent default form-like behavior
			try{ if(e && e.preventDefault) e.preventDefault(); }catch(err){}
			send_message(e);
		}

		SEEN_STATUS = true;
	}

	setInterval(function(){

		var radio_chat = _("radio_chat");
		var radio_contacts = _("radio_contacts");

		try{
			if(CURRENT_CHAT_USER != "" && radio_chat && radio_chat.checked){
				get_data({ userid:CURRENT_CHAT_USER, seen:SEEN_STATUS }, "chats_refresh");
			}

			// avoid polling contacts when the user is actively using the contact search
			if(radio_contacts && radio_contacts.checked){
				try{
					var contactSearch = document.getElementById('contact_search');
					var searchActive = false;
					if(contactSearch){
						var v = (contactSearch.value||'').trim();
						if(v !== '' || document.activeElement === contactSearch) searchActive = true;
					}
						if(!searchActive){
							get_data({}, "contacts");
						} else {
							// do not overwrite user's search results while typing/focused
							log_left_panel_debug('Skipping contacts poll because contact search is active');
						}
				}catch(e){ console.warn('contacts poll check failed', e); get_data({}, "contacts"); }
			}
		}catch(e){ console.warn('periodic refresh failed', e); }

	},3000);

// Refresh current chat when window/tab regains focus or becomes visible
window.addEventListener('focus', function(){
	try{

			get_data({ userid: String(CURRENT_CHAT_USER), seen: true }, "chats_refresh");

	}catch(e){ console.warn('focus refresh failed', e); }
});

});

	function set_seen(e){

		SEEN_STATUS = true;

	}

	function delete_message(e)

				rowid:msgid
			},"delete_message");

	function delete_thread(e)
	{

		if(confirm("Are you sure you want to delete this whole thread?")){

		
		get_data({
				userid:CURRENT_CHAT_USER,
			},"delete_thread");

		get_data({
				userid:CURRENT_CHAT_USER,
				seen:SEEN_STATUS
			},"chats_refresh");

		}
	}

<script type="text/javascript">

		function collect_data(){

   		var save_settings_button = _("save_settings_button");
   		save_settings_button.disabled = true;
   		save_settings_button.value = "Loading...Please wait..";

   		var myform = _("myform");
   		var inputs = myform.getElementsByTagName("INPUT");

   		var data = {};
   		for (var i = inputs.length - 1; i >= 0; i--) {

   			var key = inputs[i].name;

   			switch(key){


					case "username":
						data.username = inputs[i].value;
						break;

					case "email":
						data.email = inputs[i].value ;
						break;

					case "gender":
    				if(inputs[i].checked){
   						data.gender = inputs[i].value;
   					}
   					break;

					case "password":
						data.password = inputs[i].value;
						break;

					case "password2":
						data.password2 = inputs[i].value;
						break;

				}
			}

			send_data(data,"save_settings");

		}

		function send_data(data,type){

   		var xml = new XMLHttpRequest();
			// ensure cookies/session are sent for this request
			xml.withCredentials = true;

   		xml.onload = function(){

   			if(xml.readyState == 4 || xml.status == 200){

   				handle_result(xml.responseText);
   				var save_settings_button = _("save_settings_button");
   				save_settings_button.disabled = false;
   				save_settings_button.value = "Save Settings";

				}

			}

			data.data_type = type;
			var data_string = JSON.stringify(data);
	 

			xml.open("POST","api.php",true);
			xml.withCredentials = true;
			xml.send(data_string);

		}
	 
		function upload_profile_image(files){
		
			var filename = files [0].name;
			// allow jpg, jpeg and png (case-insensitive)
			var ext = (filename.split('.').pop() || '').toLowerCase();
			if(['jpg','jpeg','png'].indexOf(ext) === -1){
				alert("This file type is not allowed. Allowed: jpg, jpeg, png");
				return;
			}
			

			var change_image_button = _("change_image_button");
			try{ if(change_image_button){ change_image_button.disabled = true; change_image_button.innerHTML = "Uploading Image..."; } }catch(e){}


			var myform = new FormData();

			var xml = new XMLHttpRequest();
			// ensure cookies/session are sent for uploads
			xml.withCredentials = true;

			xml.onreadystatechange = function(){
				if(xml.readyState !== 4) return;
				// log response for debugging
				try{ console.log('upload_profile_image response', xml.status, xml.responseText); }catch(e){}
				if(xml.status == 200){
					var txt = xml.responseText;
					try{ console.log('uploader response:', txt); }catch(e){}
					// try to parse JSON and update the profile image immediately if server returned the file path
					try{
						var j = JSON.parse(txt);
						// if server reports unauthenticated, redirect to login so user can re-authenticate
						if(j && typeof j.logged_in !== 'undefined' && j.logged_in === false){
							try{ alert('Session expired — please log in'); }catch(e){}
							window.location = 'login.php';
							return;
						}
						if(j && j.file){
							console.log('uploader returned file:', j.file);
							try{
								var profile_image_el = _("profile_image");
								var src = j.file;
								// ensure the URL is safe and add cache-buster
								src = encodeURI(src) + (src.indexOf('?') === -1 ? '?_=' + Date.now() : '&_=' + Date.now());
								if(profile_image_el) profile_image_el.src = src;
							}catch(e){ console.warn('failed to set profile image from uploader response', e); }

							// also try to fetch the file directly (force GET) so we can confirm server serves it and warm cache
							try{
								var fetchUrl = encodeURI(j.file) + (j.file.indexOf('?') === -1 ? '?_=' + Date.now() : '&_=' + Date.now());
								console.log('Fetching uploaded file to warm cache:', fetchUrl);
								fetch(fetchUrl, { method: 'GET', credentials: 'same-origin' }).then(function(resp){
									console.log('fetch uploaded file status', resp.status, fetchUrl);
								}).catch(function(err){ console.warn('fetch uploaded file failed', err); });
							}catch(e){ console.warn('failed to fetch uploaded file', e); }
						}

function attachMicHandlers(){
	var mic = document.getElementById('mic_button');
	if(!mic) return;
	if(mic.dataset.micBound === '1') return;
	mic.dataset.micBound = '1';

	var activePointerId = null;

	function startRecordingForUI(){
		if(_isRecording) return;
		if(!CURRENT_CHAT_USER){
			alert('Open a chat to send audio.');
			return;
		}
		startMicRecording();
	}

	function stopRecordingForUI(){
		if(!_isRecording) return;
		stopMicRecording();
	}

	function releaseRecordingForUI(e){
		if(e && activePointerId !== null){
			try{
				if(typeof mic.releasePointerCapture === 'function' && mic.hasPointerCapture && mic.hasPointerCapture(activePointerId)){
					mic.releasePointerCapture(activePointerId);
				}
			}catch(err){}
		}
		activePointerId = null;
		stopRecordingForUI();
	}

	mic.addEventListener('pointerdown', function(e){
		if(e.pointerType === 'mouse' && e.button !== 0) return;
		e.preventDefault();
		activePointerId = typeof e.pointerId === 'number' ? e.pointerId : null;
		try{
			if(activePointerId !== null && typeof mic.setPointerCapture === 'function'){
				mic.setPointerCapture(activePointerId);
			}
		}catch(err){}
		startRecordingForUI();
	});

	mic.addEventListener('pointerup', function(e){
		e.preventDefault();
		releaseRecordingForUI(e);
	});

	mic.addEventListener('pointercancel', function(e){
		e.preventDefault();
		releaseRecordingForUI(e);
	});

	mic.addEventListener('lostpointercapture', function(e){
		e.preventDefault();
		releaseRecordingForUI(e);
	});

	mic.addEventListener('contextmenu', function(e){
		e.preventDefault();
	});
}

// Attach handlers for live WebRTC hold-to-talk (uses signalingClient.startLiveTalk/stopLiveTalk)
function attachLiveMicHandlers(){
	const liveBtns = Array.from(document.querySelectorAll('#walkie_button'));
	const indicator = document.getElementById('live_talk_indicator');
	if(!liveBtns.length) return;

	let liveActive = false;

	function startLive(){
		if(liveActive) return;
		if(!CURRENT_CHAT_USER){
			alert('Open a chat to start live talk');
			return;
		}

		// ensure current user id is known before attempting signaling
		if(!getCurrentUserId()){
			alert('Please sign in or reload the page to enable live talk');
			console.warn('startLive aborted: CURRENT_USER_ID not set');
			return;
		}
		if(String(CURRENT_CHAT_USER) === String(window.CURRENT_USER_ID)){
			console.warn('refusing to call self');
			return;
		}

		liveActive = true;

		try{
			console.log('starting live talk to CURRENT_CHAT_USER =', CURRENT_CHAT_USER, 'from', window.CURRENT_USER_ID);
			if(window.signalingClient) window.signalingClient.startLiveTalk(String(CURRENT_CHAT_USER));
		}catch(e){
			console.error('startLive error', e);
		}

		if(indicator) indicator.style.display = 'inline';
	}

	function stopLive(){
		if(!liveActive) return;
		liveActive = false;

		try{
			stopTransmit();
		}catch(e){
			console.error('stopTransmit error', e);
		}

		if(indicator) indicator.style.display = 'none';
	}

	liveBtns.forEach(function(btn){
		if(btn.dataset.liveBound === '1') return;
		btn.dataset.liveBound = '1';

		btn.addEventListener('pointerdown', function(e){
			e.preventDefault();
			startLive();
		});

		btn.addEventListener('pointerup', function(e){
			e.preventDefault();
			stopLive();
		});

		btn.addEventListener('pointercancel', function(e){
			e.preventDefault();
			stopLive();
		});

		btn.addEventListener('lostpointercapture', function(e){
			e.preventDefault();
			stopLive();
		});

		btn.addEventListener('contextmenu', function(e){
			e.preventDefault();
		});
	});
}

async function startMicRecording(){
	if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ alert('Recording not supported'); return; }
	try{
		var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
		_recordingStream = stream;
		_recordedChunks = [];
		// pick a supported mimeType when available to avoid browsers producing empty blobs
		var recorderOptions = {};
		try{
			var preferred = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg','audio/wav'];
			for(var i=0;i<preferred.length;i++){
				var t = preferred[i];
				if(typeof MediaRecorder !== 'undefined' && typeof MediaRecorder.isTypeSupported === 'function'){
					if(MediaRecorder.isTypeSupported(t)){
						recorderOptions.mimeType = t; break;
					}
				}
			}
		}catch(e){ console.warn('mime test fail', e); }
		try{
			_mediaRecorder = Object.keys(recorderOptions).length ? new MediaRecorder(stream, recorderOptions) : new MediaRecorder(stream);
		}catch(err){
			console.warn('MediaRecorder construction with options failed, falling back:', err);
			_mediaRecorder = new MediaRecorder(stream);
		}
		_mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) _recordedChunks.push(e.data); };
		_mediaRecorder.onstop = async function(){
			_isRecording = false;
			try{ document.getElementById('recording_indicator').style.display = 'none'; }catch(e){}
			clearTimeout(_recordingTimeout);
			// ensure any buffered data is flushed (some implementations require requestData before stop)
			try{ if(typeof _mediaRecorder.requestData === 'function') _mediaRecorder.requestData(); }catch(e){}
			var blob = new Blob(_recordedChunks, { type: _recordedChunks[0] ? _recordedChunks[0].type : (recorderOptions.mimeType || 'audio/webm') });
			// stop tracks
			try{ _recordingStream.getTracks().forEach(t=>t.stop()); }catch(e){}
			_recordingStream = null;
			_mediaRecorder = null;
			if(!blob || blob.size === 0){
				console.warn('Recorded blob is empty. _recordedChunks length:', _recordedChunks.length);
				alert('Recording failed — no audio data captured. Try again.');
				return;
			}
			uploadAudioBlob(blob, recorderOptions.mimeType || '');
		};
		_mediaRecorder.start();
		_isRecording = true;
		try{ document.getElementById('recording_indicator').style.display = 'inline'; }catch(e){}
		// enforce max length
		_recordingTimeout = setTimeout(function(){ if(_isRecording) stopMicRecording(); }, MAX_RECORD_MS);
	}catch(err){ console.error('mic err',err); alert('Microphone access denied or not available.'); }
}

function stopMicRecording(){
	if(_mediaRecorder && _mediaRecorder.state !== 'inactive'){
		try{ // requestData to flush any pending data before stopping
			if(typeof _mediaRecorder.requestData === 'function') _mediaRecorder.requestData();
		}catch(e){ console.debug('requestData not available', e); }
		_mediaRecorder.stop();
	}
	_isRecording = false;
}

async function uploadAudioBlob(blob, fallbackMimeType){
	if(!CURRENT_CHAT_USER){ alert('Open a chat to send audio.'); return; }
	var mimeType = String(blob && blob.type ? blob.type : (fallbackMimeType || '')).toLowerCase();
	var ext = 'webm';
	if(mimeType.indexOf('mpeg') !== -1 || mimeType.indexOf('mp3') !== -1) ext = 'mp3';
	else if(mimeType.indexOf('wav') !== -1) ext = 'wav';
	else if(mimeType.indexOf('ogg') !== -1) ext = 'ogg';
	else if(mimeType.indexOf('mp4') !== -1 || mimeType.indexOf('m4a') !== -1 || mimeType.indexOf('aac') !== -1) ext = 'mp4';
	var filename = 'audio_'+Date.now()+'.'+ext;
	var form = new FormData();
	form.append('file', blob, filename);
	form.append('data_type','send_audio');
	form.append('userid', CURRENT_CHAT_USER);

	try{
	var resp = await fetch('uploader.php', { method: 'POST', body: form, credentials: 'same-origin' });
			var txt = await resp.text();
			try{ var json = JSON.parse(txt); }catch(e){ console.error('invalid json', txt); return; }
			console.log('uploadAudioBlob uploader response', json);
			console.log('uploadAudioBlob mime', mimeType || '(empty)', 'filename', filename);
			if(json && json.file){
				// warm cache by fetching the uploaded audio file (do not autoplay)
				var audioFetchUrl = encodeURI(json.file) + (json.file.indexOf('?') === -1 ? '?_=' + Date.now() : '&_=' + Date.now());
				try{ fetch(audioFetchUrl, { method: 'GET', credentials: 'same-origin' }).then(function(r){ console.log('audio fetch status', r.status, audioFetchUrl); }).catch(function(err){ console.warn('audio fetch failed', err); }); }catch(e){console.warn('audio fetch error',e);}
			}
			// refresh chat
			get_data({ userid: CURRENT_CHAT_USER, seen: SEEN_STATUS }, 'chats_refresh');
	}catch(e){ console.error('upload audio failed', e); alert('Audio upload failed'); }
}

		function format_voice_note_duration(totalSeconds){
			totalSeconds = Math.max(0, Math.round(Number(totalSeconds) || 0));
			var mins = Math.floor(totalSeconds / 60);
			var secs = totalSeconds % 60;
			return mins + ':' + String(secs).padStart(2, '0');
		}

		function sync_voice_note_meta(audioEl){
			try{
				if(!audioEl || !audioEl.closest) return;
				var card = audioEl.closest('.message_voice_note');
				if(!card) return;
				var durationEl = card.querySelector('.message_voice_note_duration');
				if(!durationEl) return false;
				var totalSeconds = Number(audioEl.duration);
				if((!isFinite(totalSeconds) || totalSeconds <= 0) && audioEl.seekable && audioEl.seekable.length){
					try{
						totalSeconds = Number(audioEl.seekable.end(audioEl.seekable.length - 1));
					}catch(e){}
				}
				if(!isFinite(totalSeconds) || totalSeconds <= 0){
					durationEl.textContent = '0:00';
					return false;
				}
				durationEl.textContent = format_voice_note_duration(totalSeconds);
				audioEl.dataset.voiceNoteDurationResolved = '1';
				return true;
			}catch(err){
				console.warn('sync_voice_note_meta failed', err);
				return false;
			}
		}

		function probe_voice_note_duration(audioEl){
			try{
				if(!audioEl || audioEl.dataset.voiceNoteDurationProbeStarted === '1' || audioEl.dataset.voiceNoteDurationResolved === '1') return;
				audioEl.dataset.voiceNoteDurationProbeStarted = '1';
				var originalTime = 0;
				try{ originalTime = Number(audioEl.currentTime) || 0; }catch(e){}

				var cleanup = function(){
					audioEl.removeEventListener('durationchange', onProbeUpdate);
					audioEl.removeEventListener('loadeddata', onProbeUpdate);
					audioEl.removeEventListener('canplay', onProbeUpdate);
					audioEl.removeEventListener('seeked', onProbeUpdate);
				};

				var onProbeUpdate = function(){
					if(!sync_voice_note_meta(audioEl)) return;
					cleanup();
					try{
						if(Math.abs((Number(audioEl.currentTime) || 0) - originalTime) > 0.01){
							audioEl.currentTime = originalTime;
						}
					}catch(e){}
				};

				audioEl.addEventListener('durationchange', onProbeUpdate);
				audioEl.addEventListener('loadeddata', onProbeUpdate);
				audioEl.addEventListener('canplay', onProbeUpdate);
				audioEl.addEventListener('seeked', onProbeUpdate);

				try{ audioEl.preload = 'auto'; }catch(e){}
				try{ audioEl.load(); }catch(e){}
				setTimeout(function(){
					if(audioEl.dataset.voiceNoteDurationResolved === '1') return;
					try{ audioEl.currentTime = 1e101; }catch(e){}
				}, 0);
			}catch(err){
				console.warn('probe_voice_note_duration failed', err);
			}
		}

		function init_voice_note_meta(container){
			try{
				var scope = (container && container.querySelectorAll) ? container : document;
				var audios = scope.querySelectorAll('.message_voice_note audio');
				Array.prototype.forEach.call(audios, function(audioEl){
					if(!audioEl) return;
					if(audioEl.dataset.voiceNoteMetaBound !== '1'){
						audioEl.dataset.voiceNoteMetaBound = '1';
						var refresh = function(){
							if(!sync_voice_note_meta(audioEl)){
								probe_voice_note_duration(audioEl);
							}
						};
						audioEl.addEventListener('loadedmetadata', refresh);
						audioEl.addEventListener('durationchange', refresh);
						audioEl.addEventListener('loadeddata', refresh);
						audioEl.addEventListener('canplay', refresh);
						audioEl.addEventListener('canplaythrough', refresh);
					}
					if(!sync_voice_note_meta(audioEl)){
						probe_voice_note_duration(audioEl);
					}
				});
			}catch(err){

				}
			}else{
				audioEl.pause();
			}
			sync_voice_note_button(audioEl);
		}catch(err){
			console.warn('toggle_voice_note failed', err);
		}
	}

		

</script>
