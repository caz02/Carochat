version: '3.8'
services:
  web:
    build: ./docker/php
    container_name: carochat_web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      - db
      - signaling
    environment:
      - DB_HOST=db
      - DB_USER=carouser
      - DB_PASS=caropass
      - DB_NAME=carochat
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: carochat_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: carochat
      MYSQL_USER: carouser
      MYSQL_PASSWORD: caropass
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  signaling:
    image: node:18
    container_name: carochat_signaling
    working_dir: /usr/src/app
    volumes:
      - ./signaling/:/usr/src/app
    command: ["node","signaling-server.js"]
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
